[project]
name = "record-follows-person-api"
version = "0.1.0"
description = "FastAPI + LangGraph + deepagents backend for 一份能跟著人走的紀錄"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # alpha-stage APIs: pinned exactly (CLAUDE.md §5). Upgrade via PR + full test run.
    "langgraph==1.2.11",
    "langchain==1.4.0",
    "langchain-anthropic==1.7.1",
    "deepagents==0.7.13",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]>=3.2",
    "apscheduler>=3.10,<4",
    "record-schema",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "pytest-timeout>=2.3"]

[tool.uv.sources]
record-schema = { path = "../../packages/schema", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "red_flags", "record"]
timeout = 120
addopts = "-q"
