[project]
name = "record-schema"
version = "0.1.0"
description = "PersonRecord shared schema (single source of truth; TS is generated by codegen.py)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["record_schema"]
