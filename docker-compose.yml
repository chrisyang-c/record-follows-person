services:
  postgres:
    image: postgres:17-alpine
    container_name: rfp-postgres
    environment:
      POSTGRES_USER: rfp
      POSTGRES_PASSWORD: rfp
      POSTGRES_DB: record_follows_person
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfp -d record_follows_person"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
